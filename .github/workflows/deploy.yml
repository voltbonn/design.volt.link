name: Build and deploy public site

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and deploy public guide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm run test
      - name: Build public site
        run: npm run build
      - name: Run public smoke and accessibility checks
        run: npm run smoke
      - name: Check external links
        run: npm run check:links
      - name: Run Storybook accessibility tests
        run: npm run test:storybook
      - name: Build Storybook
        run: npm run build-storybook
      - name: Upload pull request preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: Cecilapp/GitHub-Pages-deploy@3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: thomas.rosen@me.com
          build_dir: dist
          cname: "design.volt.link"
          branch: deploy_frontend
